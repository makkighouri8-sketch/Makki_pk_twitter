<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PK Twitter 🇵🇰</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-black text-white min-h-screen flex justify-center pb-16">
  <div class="w-full max-w-lg border-x border-gray-800 min-h-screen flex flex-col">
    
    <!-- Top Header -->
    <div class="sticky top-0 bg-black/80 backdrop-blur border-b border-gray-800 p-4 flex justify-between items-center z-10">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-sky-500 flex items-center justify-center font-bold text-white">M</div>
        <h1 class="text-lg font-bold text-sky-400">PK Twitter 🇵🇰</h1>
      </div>
      <button onclick="switchTab('profile')" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-full font-semibold">View Profile</button>
    </div>

    <!-- Feed Tab -->
    <div id="feedTab" class="p-4 flex-1">
      <!-- Create Post Box -->
      <div class="border-b border-gray-800 pb-4">
        <div class="flex gap-3">
          <div class="w-10 h-10 rounded-full bg-sky-500 flex-shrink-0 flex items-center justify-center font-bold text-white">M</div>
          <div class="w-full">
            <textarea id="tweetInput" class="w-full bg-transparent text-white text-lg focus:outline-none resize-none placeholder-gray-500" rows="3" placeholder="What is happening in Pakistan?!"></textarea>
            
            <!-- Image/Video Preview -->
            <div id="mediaPreviewContainer" class="hidden relative my-2">
              <img id="imagePreview" class="w-full max-h-60 object-cover rounded-2xl border border-gray-800 hidden" />
              <video id="videoPreview" class="w-full max-h-60 rounded-2xl border border-gray-800 hidden" controls></video>
              <button onclick="clearMedia()" class="absolute top-2 right-2 bg-black/70 hover:bg-black rounded-full p-1 text-white"><i class="fas fa-times px-1"></i></button>
            </div>

            <!-- Action Bar -->
            <div class="flex justify-between items-center border-t border-gray-800/60 pt-3 mt-2">
              <label class="text-sky-400 hover:bg-sky-500/10 p-2 rounded-full cursor-pointer transition">
                <i class="far fa-image text-lg"></i>
                <input type="file" id="mediaInput" accept="image/*,video/*" class="hidden" onchange="handleMediaSelect(event)">
              </label>
              <button onclick="postTweet()" class="bg-sky-500 hover:bg-sky-600 font-bold px-5 py-1.5 rounded-full text-sm">Post</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Feed Posts -->
      <div id="feed" class="space-y-4 mt-4"></div>
    </div>

    <!-- Profile Tab (Hidden by default) -->
    <div id="profileTab" class="p-4 hidden flex-1">
      <div class="bg-gray-900 rounded-2xl p-4 text-center border border-gray-800">
        <div class="w-20 h-20 rounded-full bg-sky-500 mx-auto flex items-center justify-center text-2xl font-bold border-4 border-black">M</div>
        <h2 class="text-xl font-bold mt-2">Makki</h2>
        <p class="text-gray-400 text-sm">@makki_user</p>
        <p class="text-gray-300 text-sm mt-3">Building digital apps & tools in Multan, Pakistan 🇵🇰</p>
        <div class="flex justify-center gap-6 mt-4 text-sm text-gray-400">
          <span><strong class="text-white">124</strong> Following</span>
          <span><strong class="text-white">1.2K</strong> Followers</span>
        </div>
      </div>
      <button onclick="switchTab('feed')" class="mt-4 w-full bg-sky-500 text-white font-bold py-2 rounded-full">Back to Feed</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg bg-black border-t border-gray-800 flex justify-around py-3 text-xl text-gray-400">
      <button onclick="switchTab('feed')" class="hover:text-sky-400"><i class="fas fa-home text-sky-400"></i></button>
      <button onclick="alert('Explore feature coming soon!')" class="hover:text-sky-400"><i class="fas fa-search"></i></button>
      <button onclick="alert('Notifications feature coming soon!')" class="hover:text-sky-400"><i class="fas fa-bell"></i></button>
      <button onclick="switchTab('profile')" class="hover:text-sky-400"><i class="fas fa-user"></i></button>
    </div>

  </div>

  <script>
    let selectedMedia = null, mediaType = null;

    function handleMediaSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(event) {
        selectedMedia = event.target.result;
        const container = document.getElementById('mediaPreviewContainer');
        const img = document.getElementById('imagePreview');
        const video = document.getElementById('videoPreview');
        
        container.classList.remove('hidden');
        if (file.type.startsWith('image/')) {
          mediaType = 'image';
          img.src = selectedMedia;
          img.classList.remove('hidden');
          video.classList.add('hidden');
        } else if (file.type.startsWith('video/')) {
          mediaType = 'video';
          video.src = selectedMedia;
          video.classList.remove('hidden');
          img.classList.add('hidden');
        }
      };
      reader.readAsDataURL(file);
    }

    function clearMedia() {
      selectedMedia = null; mediaType = null;
      document.getElementById('mediaInput').value = '';
      document.getElementById('mediaPreviewContainer').classList.add('hidden');
      document.getElementById('imagePreview').src = '';
      document.getElementById('videoPreview').src = '';
    }

    function postTweet() {
      const input = document.getElementById('tweetInput');
      if (!input.value.trim() && !selectedMedia) return;

      const feed = document.getElementById('feed');
      const tweet = document.createElement('div');
      tweet.className = 'border-b border-gray-800 pb-4 pt-2';

      let mediaHTML = '';
      if (selectedMedia) {
        if (mediaType === 'image') {
          mediaHTML = `<img src="${selectedMedia}" class="w-full max-h-80 object-cover rounded-2xl mt-3 border border-gray-800"/>`;
        } else if (mediaType === 'video') {
          mediaHTML = `<video src="${selectedMedia}" controls class="w-full max-h-80 rounded-2xl mt-3 border border-gray-800"></video>`;
        }
      }

      tweet.innerHTML = `
        <div class="flex gap-3">
          <div class="w-10 h-10 rounded-full bg-sky-500 flex-shrink-0 flex items-center justify-center font-bold text-white">M</div>
          <div class="w-full">
            <div class="flex items-center gap-2">
              <span class="font-bold text-white">Makki</span>
              <span class="text-gray-500 text-sm">@makki_user · Just now</span>
            </div>
            <p class="text-white mt-1 text-base">${input.value}</p>
            ${mediaHTML}
            <div class="flex justify-between text-gray-500 text-sm mt-3 pr-6 max-w-md">
              <button onclick="this.classList.toggle('text-sky-400')" class="flex items-center gap-2 hover:text-sky-400"><i class="far fa-comment"></i> 0</button>
              <button onclick="this.classList.toggle('text-green-500')" class="flex items-center gap-2 hover:text-green-500"><i class="fas fa-retweet"></i> 0</button>
              <button onclick="toggleLike(this)" class="flex items-center gap-2 hover:text-pink-500"><i class="far fa-heart"></i> <span class="like-count">0</span></button>
            </div>
          </div>
        </div>
      `;

      feed.prepend(tweet);
      input.value = '';
      clearMedia();
    }

    function toggleLike(btn) {
      const icon = btn.querySelector('i');
      const countEl = btn.querySelector('.like-count');
      let count = parseInt(countEl.innerText);
      
      if (icon.classList.contains('far')) {
        icon.classList.replace('far', 'fas');
        btn.classList.add('text-pink-500');
        countEl.innerText = count + 1;
      } else {
        icon.classList.replace('fas', 'far');
        btn.classList.remove('text-pink-500');
        countEl.innerText = count - 1;
      }
    }

    function switchTab(tab) {
      if (tab === 'feed') {
        document.getElementById('feedTab').classList.remove('hidden');
        document.getElementById('profileTab').classList.add('hidden');
      } else if (tab === 'profile') {
        document.getElementById('profileTab').classList.remove('hidden');
        document.getElementById('feedTab').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
