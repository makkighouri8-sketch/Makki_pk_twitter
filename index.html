<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PkTweed 🇵🇰</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    html, body {
      background-color: #000000 !important;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      margin: 0; padding: 0; width: 100%; min-height: 100vh;
      overflow-x: hidden; overflow-y: auto;
      -webkit-overflow-scrolling: touch; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent !important;
    }
    *, *:focus, *:active { -webkit-tap-highlight-color: transparent !important; outline: none !important; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #222222; border-radius: 4px; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    .page-view { display: block; animation: fadeIn 0.25s ease-in-out; }
    .page-view.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    header, nav { backdrop-filter: blur(16px) !important; -webkit-backdrop-filter: blur(16px) !important; background-color: rgba(0, 0, 0, 0.85) !important; }
    
    /* Neon White Waves Pulse Animation for (+) Button */
    @keyframes neonWhitePulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7), 0 0 0 0 rgba(0, 240, 255, 0.7);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(255, 255, 255, 0), 0 0 0 25px rgba(0, 240, 255, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0), 0 0 0 0 rgba(0, 240, 255, 0);
      }
    }
    .neon-waves-btn {
      animation: neonWhitePulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    #tringoModal > div, #postModal > div, #walletModal > div, #authOverlay > div, #accountPickerModal > div {
      background: rgba(10, 10, 10, 0.98);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(56, 189, 248, 0.15);
      animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalPop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    ::selection { background: #0ea5e9; color: #000000; }
    button, article button { outline: none !important; cursor: pointer; transition: transform 0.1s ease, background-color 0.2s ease; }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body class="bg-black text-white antialiased min-h-screen pb-24 select-none overflow-x-hidden">

  <!-- PROFESSIONAL AUTH OVERLAY -->
  <div id="authOverlay" class="fixed inset-0 bg-black z-[999] flex flex-col justify-center items-center p-6 text-center transition-opacity duration-500">
    <div class="max-w-md w-full bg-gray-950 border border-gray-800 rounded-3xl p-6 shadow-2xl relative text-left">
      
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-full bg-black border-2 border-sky-400 mx-auto flex items-center justify-center shadow-lg mb-2">
          <svg class="w-8 h-8 text-[#00f3ff]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
        </div>
        <h1 class="text-2xl font-extrabold text-white">Welcome back to <span class="text-[#00f3ff]">PkTweed</span></h1>
        <p class="text-gray-400 text-xs mt-1">Pakistan's Global Social Network & Creator Platform 🇵🇰[span_0](start_span)[span_0](end_span)</p>
      </div>

      <!-- Social Login Buttons -->
      <div class="space-y-3">
        <button onclick="openAccountPicker('google')" class="w-full flex items-center justify-center gap-3 bg-white text-black font-bold py-3 px-4 rounded-xl hover:bg-gray-200 transition shadow text-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Continue with Google
        </button>

        <button onclick="openAccountPicker('facebook')" class="w-full flex items-center justify-center gap-3 bg-[#1877F2] text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-600 transition shadow text-sm">
          <i class="fab fa-facebook-f text-lg"></i>
          Continue with Facebook
        </button>

        <button onclick="openAccountPicker('tiktok')" class="w-full flex items-center justify-center gap-3 bg-zinc-900 border border-zinc-800 text-white font-bold py-3 px-4 rounded-xl hover:bg-zinc-800 transition shadow text-sm">
          <i class="fab fa-tiktok text-lg text-cyan-400"></i>
          Continue with TikTok
        </button>
      </div>

      <div class="flex items-center my-4 text-gray-500 text-xs">
        <div class="flex-1 border-t border-gray-800"></div>
        <span class="px-3">OR</span>
        <div class="flex-1 border-t border-gray-800"></div>
      </div>

      <div class="space-y-3">
        <input type="text" id="authEmail" placeholder="Email or Username" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-sky-500">
        <input type="password" id="authPassword" placeholder="Password" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-sky-500">
        <button onclick="handleEmailLogin()" class="w-full bg-sky-500 hover:bg-sky-400 text-black font-bold py-3 rounded-xl text-sm transition shadow-lg">Log in</button>
      </div>
    </div>
  </div>

  <!-- MULTI-ACCOUNT SELECTOR POPUP MODAL -->
  <div id="accountPickerModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[1000] hidden flex justify-center items-center p-4">
    <div class="bg-gray-950 border border-gray-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative text-left">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3 mb-3">
        <h3 id="pickerTitle" class="font-extrabold text-sm text-white flex items-center gap-2">Choose an account</h3>
        <button onclick="closeAccountPicker()" class="text-gray-400 hover:text-white"><i class="fas fa-times text-base"></i></button>
      </div>
      <p class="text-xs text-gray-400 mb-3">Select your account to continue to PkTweed:</p>
      <div id="accountsListContainer" class="space-y-2 max-h-60 overflow-y-auto mb-3"></div>
      <button onclick="addNewAccountPrompt()" class="w-full border border-dashed border-gray-700 hover:border-sky-500 text-sky-400 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
        <i class="fas fa-plus"></i> Use another account
      </button>
    </div>
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-xl mx-auto border-x border-gray-800 min-h-screen flex flex-col relative bg-black">
    <header id="navbarHeader" class="sticky top-0 px-4 py-3 flex justify-between items-center z-50 shadow-md min-h-[56px] w-full border-b border-gray-800">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-sky-500 text-black font-bold flex items-center justify-center text-sm">M</div>
        <span class="text-white font-semibold text-sm">Makki</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="switchPage('profile')" class="text-xs bg-gray-900 hover:bg-gray-800 text-white border border-gray-700 font-medium px-3 py-1.5 rounded-full transition">My Profile</button>
        <button onclick="openWalletModal()" class="text-xs bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-extrabold px-3 py-1.5 rounded-full transition flex items-center gap-1"><i class="fas fa-wallet"></i> Wallet</button>
      </div>
    </header>

    <main class="flex-1 w-full pb-20">
      <section id="pageFeed" class="page-view block w-full">
        <div id="timeline" class="divide-y divide-gray-800/80 w-full"></div>
      </section>
      <section id="pageExplore" class="page-view hidden p-4 w-full">
        <h2 class="font-extrabold text-lg mb-3">Trending in Pakistan</h2>
      </section>
      <section id="pageNotif" class="page-view hidden p-4 w-full"></section>
      <section id="pageProfile" class="page-view hidden w-full">
        <div class="h-32 bg-gradient-to-r from-sky-500 to-blue-700"></div>
        <div class="px-4 pb-4 border-b border-gray-800 relative">
          <div class="flex justify-between items-end">
            <div class="w-20 h-20 rounded-full bg-sky-500 border-4 border-black -mt-10 flex items-center justify-center font-extrabold text-2xl text-black shadow-xl">M</div>
          </div>
          <div class="mt-3 flex items-center gap-1.5">
            <h2 id="profileNameDisplay" class="text-xl font-extrabold">Makki</h2>
            <span id="profileGreenTick" class="hidden"><i class="fas fa-check-circle text-sky-400 text-base"></i></span>
          </div>
          <p id="profileHandleDisplay" class="text-gray-500 text-sm">@makki</p>
        </div>
      </section>
    </main>

    <!-- HIDDEN REAL CAMERA INPUT (Triggers Device Camera Directly) -->
    <input type="file" id="directCameraInput" accept="image/*,video/*" capture="environment" class="hidden" onchange="handleDirectCameraCapture(event)">

    <!-- FLOATING (+) ACTION BUTTON WITH NEON WHITE WAVES -->
    <button onclick="triggerDirectCamera()" class="fixed bottom-20 right-5 z-40 w-14 h-14 bg-sky-500 hover:bg-sky-400 rounded-full text-black font-extrabold flex items-center justify-center shadow-2xl neon-waves-btn transition-transform active:scale-95 border border-white/60">
      <i class="fas fa-plus text-2xl"></i>
    </button>
  </div>

  <script src="auth.js?v=5.0"></script>
  <script src="algorithm.js?v=5.0"></script>
  <script src="components.js?v=5.0"></script>
  <script src="app.js?v=5.0"></script>
</body>
</html>
